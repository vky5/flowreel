# Publishes to npm when a version tag like v0.1.1 is pushed (made by `npm version patch`).
# Uses npm trusted publishing: no npm token is stored; GitHub proves which repo and workflow is publishing.
name: Publish
on:
  push:
    tags: ["v*"]
permissions:
  contents: read
  id-token: write # lets npm check this run really comes from this repo
jobs:
  publish:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24 # its npm is new enough for trusted publishing
          registry-url: https://registry.npmjs.org
      - name: Check the tag matches the version in package.json
        run: test "v$(node -p 'require("./package.json").version')" = "$GITHUB_REF_NAME"
      - run: npm ci
      - run: npm test
      - run: npm publish
